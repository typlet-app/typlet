[package]
name = "typlet-editor"
description = "The Typlet editor: create and edit snippets with formatting, placeholders and forms, change settings, import from espanso."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "typlet-editor"
path = "src/main.rs"

[dependencies]
typlet-core.workspace = true
typlet-import.workspace = true
typlet-platform.workspace = true
chrono.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"

# The updater, without its `zip` feature: Typlet ships plain installers.
# Windows uses the system's TLS (Schannel), so company proxies whose root
# certificates are installed in Windows are trusted; Linux uses rustls and
# needs no OpenSSL.
[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dev-dependencies]
tempfile.workspace = true
# The updater's own signature libraries, to test the release key (tests/updater_key.rs).
base64 = "0.22"
minisign-verify = "0.3"

[features]
# Enabled by `tauri build`: serve the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
