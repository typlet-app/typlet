name: Test builds

# Builds the background program and the editor for Windows and Linux so changes can be tried
# on real machines before a release. Download the files from the "Artifacts"
# section of a workflow run. The builds are unsigned (see docs/adr/0008).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: typlet-windows-x64
          # The oldest supported Ubuntu, so the binary runs on newer systems too.
          - name: Linux x64
            os: ubuntu-22.04
            artifact: typlet-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: scripts/install-linux-deps.sh libxkbcommon-dev libfontconfig1-dev libwayland-dev libwebkit2gtk-4.1-dev libdbus-1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/typlet-editor/web/package-lock.json
      - name: Build the editor interface
        working-directory: crates/typlet-editor/web
        run: |
          npm ci
          npm run build
      - name: Build
        # `custom-protocol` embeds the built interface into the editor.
        run: cargo build --release --locked -p typlet -p typlet-editor --features typlet-editor/custom-protocol
      - name: Collect files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/release/typlet.exe target/release/typlet-editor.exe dist/
          cp LICENSE docs/testing/test-build.md dist/
      - name: Collect files (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/typlet target/release/typlet-editor dist/
          cp LICENSE docs/testing/test-build.md packaging/linux/60-typlet-uinput.rules dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30
