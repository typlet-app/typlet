name: Release

# Builds the installers and creates a *draft* GitHub release when a version
# tag (v1.2.3) is pushed. Review the draft, then publish it. Versions with a
# suffix (v1.0.0-rc.1) become pre-releases; 0.x versions are titled "Beta"
# but are normal releases, because the updater reads `latest.json` from the
# latest normal release (ADR 0015).
# The full procedure is in docs/releasing.md.

on:
  push:
    tags: ["v*"]
  # Changes to the packaging build the installers (without a release), so
  # problems show up before the next tag.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "crates/typlet-editor/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            bundles: nsis
          # The oldest supported Ubuntu, so the packages run on newer systems too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml has version $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/typlet-editor/web/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: >-
          scripts/install-linux-deps.sh
          libxkbcommon-dev libfontconfig1-dev libwayland-dev libwebkit2gtk-4.1-dev libdbus-1-dev file

      - name: Install the editor interface's packages
        working-directory: crates/typlet-editor/web
        run: npm ci

      # The background program ships inside the editor's installer as a
      # "sidecar" binary named after the target (see packaging/tauri.release.json).
      - name: Build the background program
        run: |
          cargo build --release --locked -p typlet
          mkdir -p crates/typlet-editor/binaries
          cp "target/release/typlet${{ matrix.exe }}" "crates/typlet-editor/binaries/typlet-${{ matrix.target }}${{ matrix.exe }}"

      - name: Build the installers
        working-directory: crates/typlet-editor
        env:
          # linuxdeploy is an AppImage itself; CI runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: node web/node_modules/@tauri-apps/cli/tauri.js build --ci --config ../../packaging/tauri.release.json --bundles ${{ matrix.bundles }}

      - name: Collect installers
        run: |
          mkdir dist
          find target/release/bundle \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -l dist
          {
            echo "### Installers (${{ matrix.name }})"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # Install and uninstall once, so a broken package fails here and not
      # on a tester's PC. Problems are reported as annotations.
      - name: Smoke test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Typlet'
          foreach ($exe in 'typlet.exe', 'typlet-editor.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $exe))) {
              $found = (Get-ChildItem $dir -Name -ErrorAction SilentlyContinue) -join ', '
              Write-Output "::error title=Windows installer::$exe missing in $dir (found: $found)"
              exit 1
            }
          }
          # The uninstaller copies itself to a temporary folder and returns at once.
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'typlet.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'typlet.exe')) {
            Write-Output "::error title=Windows installer::uninstalling left $dir\typlet.exe behind"
            exit 1
          }
          Write-Output "::notice title=Windows installer::$($setup.Name) installs typlet.exe and typlet-editor.exe to %LOCALAPPDATA%\Typlet and uninstalls cleanly"

      - name: Smoke test the Linux packages
        if: runner.os == 'Linux'
        run: |
          fail() { echo "::error title=Linux packages::$1"; exit 1; }
          deb=$(ls dist/*.deb)
          package=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "./$deb"
          for f in /usr/bin/typlet /usr/bin/typlet-editor; do [ -x "$f" ] || fail "$f missing after installing $package"; done
          [ -f /usr/lib/udev/rules.d/60-typlet-uinput.rules ] || fail "udev rule missing"
          id -nG "$USER" | grep -qw input || groups "$USER" | grep -qw input || fail "the post-install script did not add $USER to the group input"
          sudo apt-get remove -y "$package"
          [ ! -e /usr/bin/typlet ] || fail "removing $package left /usr/bin/typlet behind"
          appimage=$(ls dist/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          for f in typlet typlet-editor; do [ -x "$RUNNER_TEMP/squashfs-root/usr/bin/$f" ] || fail "$f missing in the AppImage"; done
          echo "::notice title=Linux packages::$(basename "$deb") installs and removes cleanly; $(basename "$appimage") contains typlet and typlet-editor"

      # Signing via the SignPath Foundation (ADR 0008) is switched on by
      # setting the repository variable SIGNPATH_ORGANIZATION_ID and the
      # secret SIGNPATH_API_TOKEN. Until then the installers are unsigned.
      - name: Upload the unsigned Windows installer for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: dist/*-setup.exe
      - name: Sign with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: typlet
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      # Updater signatures (ADR 0015). They are made after code signing,
      # which changes the Windows installer. Without the secret (forks), the
      # installers get none and the release has no `latest.json`.
      - name: Sign for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice title=Updater::no signing key configured; the installers are not signed for the updater"
            exit 0
          fi
          # The version goes into the signature; the updater requires it, so
          # an old installer cannot be passed off as a newer version.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for installer in dist/*-setup.exe dist/*.deb dist/*.AppImage; do
            [ -e "$installer" ] || continue
            node crates/typlet-editor/web/node_modules/@tauri-apps/cli/tauri.js signer sign \
              --app-version "$version" "$installer" > /dev/null
            echo "signed $(basename "$installer") for the updater"
          done
          echo "::notice title=Updater::$(ls dist/*.sig | wc -l) installers signed for the updater"

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: |
          python3 scripts/updater-manifest.py dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" CHANGELOG.md
          # The signatures are inside latest.json; the release page stays tidy.
          rm -f dist/*.sig
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions like 1.0.0-rc.1 are pre-releases, which the updater
          # ignores; 0.x versions are betas by name only.
          prerelease="" suffix=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          case "$GITHUB_REF_NAME" in v0.*|*-*) suffix=" (Beta)" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease \
            --title "Typlet ${GITHUB_REF_NAME#v}$suffix" \
            --notes-file docs/release-notes.md
