# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`. CI runs the same check on every push.

[graph]
all-features = true
# Only check dependencies for the platforms Typlet ships on.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Known security advisories fail the build. Add entries here only with a
# comment explaining why the advisory does not affect Typlet.
ignore = []
# "Unmaintained" notices fail the build only for crates Typlet uses directly.
# Transitive ones (for example font parsing and D-Bus crates inside Slint) can
# only be replaced upstream and are reviewed when dependencies are updated.
unmaintained = "workspace"

[licenses]
# Every dependency must be under a licence compatible with GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: licences may be allowed before any
# dependency uses them.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published; they carry the project licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
